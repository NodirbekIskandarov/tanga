[pytest]
testpaths = tests
# Jonli AI testlari (pytest -m live) standart ishga tushirishda va CI da
# ATAYLAB o'tkazib yuboriladi: ular haqiqiy API'ga pul to'lab murojaat
# qiladi. Faqat qo'lda: pytest -m live
addopts = -m "not live"
markers =
    live: haqiqiy Anthropic API'ga murojaat qiladigan test (faqat qo'lda)
