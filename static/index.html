<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Tanga</title>
<link rel="icon" href="/static/icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon-180.png" />
<meta name="theme-color" content="#c8902a" />
<link rel="stylesheet" href="/static/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="aurora" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
</div>
<div id="app">

  <header class="topbar">
    <h1>🪙 Tanga</h1>
    <div class="topbar-actions">
      <button id="csvBtn" class="icon-btn" aria-label="CSV eksport">📤</button>
      <button id="searchToggle" class="icon-btn" aria-label="Qidiruv">🔍</button>
    </div>
  </header>

  <!-- Qidiruv paneli -->
  <section id="searchPanel" class="search-panel hidden">
    <input id="searchInput" type="text" inputmode="search" placeholder="Qidirish… (masalan: taksi)" />
    <div id="searchMeta" class="search-meta"></div>
    <div id="searchResults" class="tx-list"></div>
  </section>

  <!-- Asosiy boshqaruv paneli -->
  <main id="dashboard">

    <div class="period-tabs" id="periodTabs">
      <button data-period="kun">Kun</button>
      <button data-period="hafta">Hafta</button>
      <button data-period="oy" class="active">Oy</button>
      <button data-period="yil">Yil</button>
    </div>

    <div class="range-nav">
      <button id="prevRange" class="icon-btn">‹</button>
      <span id="rangeLabel">—</span>
      <button id="nextRange" class="icon-btn">›</button>
    </div>

    <div class="kind-tabs" id="kindTabs">
      <button data-kind="hammasi" class="active">Hammasi</button>
      <button data-kind="kirim">Kirim</button>
      <button data-kind="chiqim">Chiqim</button>
      <button data-kind="qarz">Qarz</button>
      <button data-kind="jamgarma">Jamg'arma</button>
    </div>

    <div class="currency-toggle" id="currencyToggle"></div>

    <section class="card">
      <div class="donut-wrap">
        <svg id="donutSvg" viewBox="0 0 200 200" class="donut">
          <circle cx="100" cy="100" r="80" class="donut-bg" />
          <g id="donutSegments" class="donut-segments"></g>
        </svg>
        <div class="donut-center">
          <div id="donutValue" class="donut-value">—</div>
          <div id="donutSub" class="donut-sub"></div>
        </div>
      </div>
      <div id="donutLegend" class="donut-legend"></div>
      <button id="incomeCta" class="cta-inline hidden">💰 Oylik kirimingizni kiriting — shunda qancha tejayotganingizni ko'rasiz</button>
    </section>

    <section class="card" id="categoryCard">
      <div id="categoryList" class="category-list"></div>
    </section>

    <h3 class="section-title" id="listTitle">So'nggi yozuvlar</h3>
    <div id="recentList" class="tx-list"></div>
    <button id="loadMore" class="load-more hidden">Yana yuklash</button>

  </main>

  <button id="fabAdd" class="fab" aria-label="Yozuv qo'shish">+</button>

  <!-- Yozuv tafsiloti / tahrirlash paneli -->
  <div id="detailBackdrop" class="sheet-backdrop hidden">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- Yangi yozuv qo'shish paneli -->
  <div id="addBackdrop" class="sheet-backdrop hidden">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div id="addBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
